<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bù Hàng Tổng Hợp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>

  <style>
    /* Ẩn dashboard/swap link của thư viện QR */
    #qr-reader__dashboard_section_csr,
    #qr-reader__dashboard_section_swaplink {
      display: none !important;
    }
    /* Đảm bảo video/canvas vừa khung */
    #qr-reader video,
    #qr-reader canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    /* Đảm bảo bảng ảnh hiển thị đúng */
    #bag-table img {
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
  </style>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-lg">
    
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">Bù Hàng Tổng Hợp (Scan & Size)</h1>
      <button id="btn-back" class="px-3 py-1 bg-gray-300 hover:bg-gray-400 rounded">
        ← Trang chủ
      </button>
    </div>

    <div id="qr-reader" class="w-full max-w-md mx-auto mb-4"></div>
    
    <div class="mb-4">
        <label for="manualRpro" class="block mb-1 font-medium">Hoặc Nhập RPRO thủ công</label>
        <div class="flex">
            <input id="manualRpro" type="text" class="flex-1 border px-3 py-2 rounded-l"
                   placeholder="Ví dụ: RPRO-123456-1234" />
            <button id="btn-manual-ok" class="bg-blue-600 hover:bg-blue-700 text-white px-4 rounded-r">
                OK
            </button>
        </div>
        <div id="loading-status" class="mt-2 text-blue-600 font-semibold hidden">
            🔄 Đang tải dữ liệu...
        </div>
    </div>
    
    <div class="mb-4">
        <label class="block">Số bịch bù (Tham khảo):</label>
        <input type="number" id="input-bag-count" class="border px-3 py-2 w-24 rounded" />
    </div>

    <h2 class="text-xl font-bold mt-4 mb-3">Tùy chọn: Chụp ảnh Bù hàng</h2>
        
    <div id="scan-status" class="text-blue-600 font-semibold mb-2"></div>

    <div id="photo-section" class="flex flex-col items-center space-y-2 mb-4 hidden">
        <div class="flex gap-2">
            <button id="btn-take-photo" class="bg-yellow-500 text-white px-4 py-2 rounded">
                📸 Chụp ảnh bịch
            </button>
            <button id="btn-retake" class="bg-red-500 text-white px-4 py-2 rounded hidden">
                🔄 Chụp lại ảnh cuối
            </button>
        </div>
        <canvas id="photo-canvas" class="hidden border rounded w-full max-w-xs"></canvas>
    </div>
        
    <table id="bag-table" class="w-full border hidden text-sm mt-4 mb-6">
        <thead>
            <tr class="bg-gray-100">
                <th class="border px-2">RPRO</th>
                <th class="border px-2">Thùng</th>
                <th class="border px-2">Ảnh</th>
                <th class="border px-2">Trạng thái</th>
                <th class="border px-2">Preview</th>
                <th class="border px-2">Thao tác</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <div id="no-order-message" class="text-center py-8 text-gray-500">
        Scan tem thùng hoặc nhập RPRO để bắt đầu.
    </div>

    <div id="order-info-area" class="border p-4 rounded bg-gray-50 hidden">
        <div id="order-info" class="mb-4 space-y-1 text-sm">
            <p><b>RPRO:</b> <span id="info-rpro"></span></p>
            <p><b>CUSTOMERS:</b> <span id="info-customers"></span></p>
            <p><b>Giới tính:</b> <span id="info-gender"></span></p>
            <p><b>Mã khuôn:</b> <span id="info-mold"></span></p>
            <p><b>BOM:</b> <span id="info-bom"></span></p>
        </div>

        <div id="size-table-container" class="overflow-x-auto"></div>

        <div class="mt-4">
            <label for="note-textarea" class="block mb-1 font-medium">Ghi chú:</label>
            <textarea id="note-textarea" class="w-full border px-3 py-2 rounded"
                      placeholder="Nhập ghi chú cho đơn hàng này (nếu có)"></textarea>
        </div>

        <div class="text-right mt-6">
            <button id="btn-confirm-supplement"
                    class="w-full bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded disabled:opacity-50"
                    disabled>
                Xác nhận Bù hàng (Lưu Size & Ảnh)
            </button>
        </div>
    </div>


  </div>

  <script>
    document.getElementById("btn-back").addEventListener("click", () => window.location.href = "/");
  </script>

  <script type="module" src="./supabaseClient.js"></script>
  <script type="module" src="./supplement-unified.js"></script>
</body>
</html>
