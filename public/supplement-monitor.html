<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiến Độ Hàng Bù - Realtime Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-cell {
            transition: all 0.3s ease;
        }

        /* Custom scrollbar for table */
        .table-container::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .blink-bg {
            animation: bg-pulse 2s infinite;
        }

        @keyframes bg-pulse {

            0%,
            100% {
                background-color: #fee2e2;
            }

            /* Red-100 */
            50% {
                background-color: #fca5a5;
            }

            /* Red-300 */
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-[1600px] mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center border border-gray-200">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">📊 Tiến Độ Hàng Bù (Realtime)</h1>
                <p class="text-xs text-gray-500 mt-1">Theo dõi trạng thái IN/OUT qua các công đoạn</p>
            </div>
            <div class="flex gap-2">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="🔍 Tìm mã RPRO..."
                        class="pl-3 pr-10 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none w-64 uppercase">
                </div>
                <button id="btn-refresh"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-sm text-sm font-bold">
                    🔄 Làm mới
                </button>
                <button onclick="window.location.href='supplement-count.html'"
                    class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition shadow-sm text-sm">
                    ← Quay lại quét
                </button>
            </div>
        </div>

        <!-- Progress Table -->
        <div
            class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden flex flex-col h-[calc(100vh-140px)]">
            <!-- Table Header (Sticky) -->
            <div class="overflow-x-auto table-container flex-1">
                <table class="w-full border-collapse text-sm">
                    <thead class="bg-gray-100 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th
                                class="p-4 text-left font-extrabold text-gray-700 border-b-2 border-r w-40 min-w-[150px]">
                                MÃ ĐƠN (RPRO)</th>
                            <th
                                class="p-3 text-center font-bold text-indigo-700 border-b-2 border-r min-w-[180px] bg-indigo-50">
                                🏷️ Dán (Lamination)</th>
                            <th
                                class="p-3 text-center font-bold text-green-700 border-b-2 border-r min-w-[180px] bg-green-50">
                                ✂️ Cắt (Prefitting)</th>
                            <th
                                class="p-3 text-center font-bold text-blue-700 border-b-2 border-r min-w-[180px] bg-blue-50">
                                🔨 Molding</th>
                            <th
                                class="p-3 text-center font-bold text-purple-700 border-b-2 border-r min-w-[180px] bg-purple-50">
                                🏭 Leanline DC</th>
                            <th class="p-3 text-center font-bold text-pink-700 border-b-2 min-w-[180px] bg-pink-50">🎯
                                Leanline Molded</th>
                        </tr>
                    </thead>
                    <tbody id="progress-table-body" class="divide-y divide-gray-100">
                        <!-- Data rows will be injected here -->
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div id="empty-state"
                class="hidden flex flex-col items-center justify-center h-64 text-gray-400 bg-gray-50 border-t">
                <div class="text-4xl mb-2">📦</div>
                <p>Chưa có dữ liệu theo dõi hôm nay</p>
            </div>
        </div>

        <!-- Detail Modal -->
        <div id="detail-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
            <div
                class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all scale-100">
                <div
                    class="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 text-white flex justify-between items-center">
                    <h3 class="font-bold text-lg">📄 Chi Tiết Đơn Hàng</h3>
                    <button id="btn-close-modal" class="text-white hover:text-gray-200 text-2xl">&times;</button>
                </div>
                <div class="p-6 space-y-3" id="modal-content">
                    <p class="text-center text-gray-400">Đang tải...</p>
                </div>
            </div>
        </div>

        <!-- Realtime Indicator -->
        <div
            class="fixed bottom-4 right-4 bg-white rounded-full shadow-lg px-3 py-1 flex items-center gap-2 border border-green-400 z-50">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold text-gray-700">LIVE</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./supabaseClient.js"></script>
    <script type="module" src="./supplement-monitor.js"></script>
</body>

</html>
