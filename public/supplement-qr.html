<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bù Hàng QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>

  <style>
    #qr-reader__dashboard_section_csr,
    #qr-reader__dashboard_section_swaplink {
      display: none !important;
    }
    #qr-reader video,
    #qr-reader canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
  </style>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-md mx-auto bg-white p-3 rounded shadow space-y-4">
    <div class="flex justify-between items-center gap-2"> <h1 class="text-xl font-bold">Bù Hàng QR</h1>
      <div class="flex gap-2"> <button id="btn-reset-scan" class="px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded">
          🔄 Scan Thùng Mới
        </button>
        <button id="btn-back" class="px-3 py-1 bg-gray-300 hover:bg-gray-400 rounded">
          ← Trang chủ
        </button>
      </div>
    </div>

    <div id="query-section" class="border p-3 rounded bg-gray-100 space-y-2">
        <h2 class="font-bold text-sm">Truy vấn lịch sử ảnh</h2>
        <div class="flex gap-2">
            <input id="queryRpro" type="text" placeholder="Nhập RPRO" class="flex-1 border px-2 py-1 rounded text-sm"/>
            <button id="btn-query-rpro" class="bg-blue-500 text-white px-3 py-1 rounded text-sm">
                Truy vấn
            </button>
        </div>
        <div id="query-result" class="text-sm"></div>
    </div>
    <div id="qr-reader" class="w-full max-w-md mx-auto"></div>
    
    <div id="scan-status" class="text-blue-600 font-semibold hidden"></div>

    <div id="photo-section" class="hidden flex flex-col items-center space-y-2">
      <div class="flex gap-2">
        <button id="btn-take-photo" class="bg-yellow-500 text-white px-4 py-2 rounded">
          📸 Chụp ảnh bịch
        </button>
        <button id="btn-retake" class="bg-red-500 text-white px-4 py-2 rounded hidden">
          🔄 Chụp lại
        </button>
      </div>

      <canvas id="photo-canvas" class="hidden border rounded w-full max-w-xs"></canvas>
    </div>



    <div class="flex gap-2">
      <button id="btn-scan-box" class="bg-blue-500 text-white px-4 py-2 rounded flex-1">Chế độ Scan Thùng</button>
      <button id="btn-scan-bag" class="bg-purple-500 text-white px-4 py-2 rounded flex-1">Chế độ Scan Bịch</button>
    </div>

    <div id="box-info" class="hidden text-sm"></div>

    <div>
      <label class="block">Số bịch bù:</label>
      <input type="number" id="input-bag-count" class="border px-2 py-1 w-24" />
    </div>

    <table id="bag-table" class="w-full border hidden text-sm">
      <thead>
        <tr class="bg-gray-100">
          <th class="border px-2">RPRO</th>
          <th class="border px-2">Thùng</th>
          <th class="border px-2">Ảnh</th>
          <th class="border px-2">Trạng thái</th>
          <th class="border px-2">Preview</th> <th class="border px-2">Thao tác</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>


    <button id="btn-save" class="w-full bg-green-600 text-white px-4 py-2 rounded hidden">
      Lưu Supabase
    </button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("btn-back")
        .addEventListener("click", () => window.location.href = "/");
    });
  </script>

  <script type="module" src="./supabaseClient.js"></script>
  <script type="module" src="./supplement-qr.js"></script>
</body>
</html>
