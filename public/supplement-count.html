<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm hàng bù - Quét QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .section-btn.active {
            border: 4px solid #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            transform: scale(1.05);
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-4 sm:p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-extrabold text-orange-600">🔢 Đếm hàng bù</h1>
            <button onclick="window.location.href='index.html'" class="text-gray-500 hover:text-gray-700">
                ✖ Đóng
            </button>
        </div>

        <!-- Section Selection -->
        <p class="text-sm font-bold text-gray-600 mb-3 uppercase tracking-wider">Chọn bộ phận (Section):</p>
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button
                class="section-btn px-4 py-3 bg-indigo-500 text-white rounded-xl font-bold hover:bg-indigo-600 transition"
                data-section="Dán">Dán</button>
            <button
                class="section-btn px-4 py-3 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 transition"
                data-section="Cắt">Cắt</button>
            <button
                class="section-btn px-4 py-3 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600 transition"
                data-section="Molding">Molding</button>
            <button
                class="section-btn px-4 py-3 bg-purple-500 text-white rounded-xl font-bold hover:bg-purple-600 transition"
                data-section="DC">Leanline DC</button>
            <button
                class="section-btn px-4 py-3 bg-pink-500 text-white rounded-xl font-bold hover:bg-pink-600 transition"
                data-section="Molded" class="col-span-2">Leanline Molded</button>
        </div>

        <!-- QR Scanner Area -->
        <div id="scanner-container" class="hidden">
            <div id="qr-reader" class="w-full rounded-lg overflow-hidden border-2 border-dashed border-gray-300"></div>
            <div class="mt-4 p-4 bg-orange-50 border border-orange-200 rounded-lg">
                <p class="text-center text-orange-800 font-medium">
                    Đang quét cho bộ phận: <span id="active-section-name" class="font-bold underline">...</span>
                </p>
            </div>
            <div id="scan-feedback" class="mt-3 text-center min-h-[40px] font-bold"></div>

            <!-- Undo Button Container -->
            <div id="undo-container" class="mt-4 hidden text-center">
                <button id="btn-undo-scan"
                    class="px-4 py-2 bg-red-100 text-red-700 rounded-lg font-bold border border-red-300 hover:bg-red-200 transition text-sm">
                    ↩️ Xóa mã vừa quét nhầm
                </button>
            </div>
        </div>

        <div class="mt-8 flex flex-col gap-4">
            <button id="btn-view-summary"
                class="w-full py-4 bg-gray-800 text-white rounded-xl font-bold text-lg hover:bg-gray-900 transition shadow-lg flex items-center justify-center gap-2">
                📊 Xem Tổng (Đối soát)
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/html5-qrcode" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./supabaseClient.js"></script>
    <script type="module" src="./supplement-count.js"></script>
</body>

</html>
