<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tồn Kho Hàng Dư</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .table-container {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #f8fafc;
            z-index: 10;
        }
    </style>
</head>

<body class="min-h-screen text-slate-800 p-4 md:p-8 bg-gradient-to-br from-slate-50 to-indigo-50">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <div class="glass-panel rounded-3xl p-6 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-slate-800 flex items-center gap-3">
                    <span class="p-2 bg-indigo-100 text-indigo-600 rounded-xl">📊</span>
                    DASHBOARD HÀNG DƯ TỔNG HỢP
                </h1>
                <p class="text-slate-500 font-bold mt-1">Theo dõi tồn kho hàng dư tại các bộ phận</p>
            </div>
            <div class="flex flex-wrap gap-3 items-center mt-4 md:mt-0">
                <input type="date" id="export-start-date"
                    class="px-3 py-2 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 outline-none focus:border-indigo-500 shadow-sm">
                <span class="text-slate-400 font-bold">-</span>
                <input type="date" id="export-end-date"
                    class="px-3 py-2 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 outline-none focus:border-indigo-500 shadow-sm">
                <button id="btn-export-excel"
                    class="px-5 py-2.5 bg-green-500 text-white hover:bg-green-600 font-bold rounded-xl shadow-md transition-colors flex items-center gap-2">
                    ⬇️ Xuất Excel
                </button>
                <button onclick="loadDashboardData()"
                    class="px-5 py-2.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-bold rounded-xl border border-indigo-200 transition-colors flex items-center gap-2">
                    🔄 Làm mới
                </button>
                <button onclick="window.location.href='https://vercel-dashboard-new.vercel.app/surplus-landing.html'"
                    class="px-5 py-2.5 bg-white text-slate-600 hover:bg-slate-50 font-bold rounded-xl border border-slate-200 transition-colors flex items-center gap-2 shadow-sm">
                    🏠 Quay lại
                </button>
            </div>
        </div>

        <!-- Dashboard Table -->
        <div class="glass-panel rounded-3xl p-6 shadow-lg">

            <div id="loading-spinner" class="py-20 text-center">
                <div
                    class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-200 border-t-indigo-600 mb-4">
                </div>
                <p class="font-bold text-slate-500">Đang tải dữ liệu...</p>
            </div>

            <div class="table-container rounded-2xl border border-slate-200 hidden" id="main-content">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="text-xs font-black uppercase tracking-wider text-slate-500 border-b-2 border-slate-200">
                            <th
                                class="p-4 bg-slate-50 rounded-tl-xl w-64 min-w-[250px] sticky left-0 z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                                Thông tin Đơn/RPRO</th>
                            <th class="p-4 bg-teal-50 text-teal-700 text-center border-l border-white w-24">LPS</th>
                            <th class="p-4 bg-indigo-50 text-indigo-700 text-center border-l border-white w-24">MOLDING
                            </th>
                            <th class="p-4 bg-orange-50 text-orange-700 text-center border-l border-white w-24">LEANLINE
                            </th>
                            <th class="p-4 bg-orange-50 text-orange-700 text-center border-l border-white w-24">LEANLINE
                            </th>
                            <th
                                class="p-4 bg-slate-100 text-slate-800 text-center border-l border-white w-28 rounded-tr-xl">
                                TỔNG CỘNG
                            </th>
                        </tr>
                    </thead>
                    <tbody id="dashboard-tbody" class="divide-y divide-slate-100 text-sm">
                        <!-- Rows rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const tbody = document.getElementById('dashboard-tbody');
        const spinner = document.getElementById('loading-spinner');
        const mainContent = document.getElementById('main-content');

        const startDateInput = document.getElementById('export-start-date');
        const endDateInput = document.getElementById('export-end-date');

        // Fetch and process data
        window.loadDashboardData = async function () {
            spinner.classList.remove('hidden');
            mainContent.classList.add('hidden');
            tbody.innerHTML = '';

            try {
                // Get surplus goods within date range
                let query = supabase.from('surplusgoods').select('*');

                const startVal = startDateInput.value;
                const endVal = endDateInput.value;
                if (startVal) query = query.gte('created_at', startVal + 'T00:00:00+07:00');
                if (endVal) query = query.lte('created_at', endVal + 'T23:59:59+07:00');

                const { data, error } = await query;
                if (error) throw error;

                // Group by RPRO, PU, FABRIC (using rpro as primary key since manual rpros are unique per mat combination)
                const groupings = {};

                data.forEach(item => {
                    const rpro = item.rpro || 'UNKNOWN';
                    if (!groupings[rpro]) {
                        groupings[rpro] = {
                            rpro: rpro,
                            pu: item.pu || '-',
                            fabric: item.fabric || '-',
                            bom: item.bom || '-',
                            lps: 0,
                            molding: 0,
                            leanline: 0,
                            lpsLastUpdated: null,
                            moldingLastUpdated: null,
                            leanlineLastUpdated: null,
                            lastUpdated: new Date(item.created_at) // Assuming created_at is updated or represents the entry time
                        };
                    }

                    // Calculate total qty for this specific line
                    let totalQty = 0;
                    Object.keys(item).forEach(k => {
                        if (k.startsWith('size_') && !isNaN(item[k])) totalQty += item[k];
                    });
                    if (item.dynamic_sizes) {
                        Object.values(item.dynamic_sizes).forEach(v => {
                            if (!isNaN(v)) totalQty += v;
                        });
                    }

                    // Add to section totals and track individual last updated dates
                    const section = (item.section || '').toUpperCase();
                    const itemDate = new Date(item.created_at);

                    if (section === 'LPS') {
                        groupings[rpro].lps += totalQty;
                        if (!groupings[rpro].lpsLastUpdated || itemDate > groupings[rpro].lpsLastUpdated) groupings[rpro].lpsLastUpdated = itemDate;
                    } else if (section === 'MOLDING') {
                        groupings[rpro].molding += totalQty;
                        if (!groupings[rpro].moldingLastUpdated || itemDate > groupings[rpro].moldingLastUpdated) groupings[rpro].moldingLastUpdated = itemDate;
                    } else if (section === 'LEANLINE') {
                        groupings[rpro].leanline += totalQty;
                        if (!groupings[rpro].leanlineLastUpdated || itemDate > groupings[rpro].leanlineLastUpdated) groupings[rpro].leanlineLastUpdated = itemDate;
                    }

                    // Update global timestamp for sorting
                    if (itemDate > groupings[rpro].lastUpdated) {
                        groupings[rpro].lastUpdated = itemDate;
                    }
                });

                window._dashboardData = Object.values(groupings);
                renderTable(window._dashboardData);

            } catch (err) {
                console.error(err);
                alert("Lỗi khi tải dữ liệu: " + err.message);
            } finally {
                spinner.classList.add('hidden');
                mainContent.classList.remove('hidden');
            }
        };

        function renderTable(rows) {
            // Sort by last updated (newest first)
            rows.sort((a, b) => b.lastUpdated - a.lastUpdated);

            const now = new Date();
            const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;

            const html = rows.map(r => {
                const total = r.lps + r.molding + r.leanline;
                if (total === 0) return ''; // Skip empty records

                const timeDiff = now - r.lastUpdated;
                const isWarningGlobal = timeDiff > sevenDaysInMs;
                const rowWarningClass = isWarningGlobal ? 'bg-rose-50/30' : ''; // Optional subtle highlight for very old entries

                // Format helper for dates
                const getDateHtml = (qty, dateObj) => {
                    if (qty <= 0 || !dateObj) return '-';
                    const diff = now - dateObj;
                    const isWarn = diff > sevenDaysInMs;

                    const timeStr = dateObj.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                    const dateStr = dateObj.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });

                    return `
                        <div class="text-xs text-slate-400 mt-1">${timeStr}</div>
                        <div class="text-[10px] text-slate-500 font-medium mb-1">${dateStr}</div>
                        ${isWarn ? `<span class="inline-block bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded text-[9px] font-bold"><span class="animate-pulse">⚠️</span> Quá hạn</span>` : ''}
                    `;
                };

                return `
                    <tr class="hover:bg-slate-50 transition-colors group ${rowWarningClass}">
                        <td class="p-4 border-r border-slate-100 sticky left-0 bg-white z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] group-hover:bg-slate-50">
                            <div class="font-black text-slate-700 mb-1 flex items-center gap-2">
                                <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-xs">${r.rpro}</span>
                            </div>
                            <div class="text-[10px] text-slate-500 font-medium">BOM: ${r.bom}</div>
                            <div class="text-[10px] text-slate-500 italic truncate max-w-[200px]" title="PU: ${r.pu}">P: ${r.pu}</div>
                            <div class="text-[10px] text-slate-500 italic truncate max-w-[200px]" title="Fb: ${r.fabric}">F: ${r.fabric}</div>
                        </td>
                        <td class="p-4 text-center border-r border-slate-100 align-top">
                            <div class="font-bold text-teal-600 text-base mb-1">${r.lps > 0 ? r.lps : '-'}</div>
                            ${getDateHtml(r.lps, r.lpsLastUpdated)}
                        </td>
                        <td class="p-4 text-center border-r border-slate-100 align-top">
                            <div class="font-bold text-indigo-600 text-base mb-1">${r.molding > 0 ? r.molding : '-'}</div>
                            ${getDateHtml(r.molding, r.moldingLastUpdated)}
                        </td>
                        <td class="p-4 text-center border-r border-slate-100 align-top">
                            <div class="font-bold text-orange-600 text-base mb-1">${r.leanline > 0 ? r.leanline : '-'}</div>
                            ${getDateHtml(r.leanline, r.leanlineLastUpdated)}
                        </td>
                        <td class="p-4 text-center border-slate-100 bg-slate-50 align-top">
                            <span class="text-xl font-black text-slate-800 block mb-1">${total}</span>
                        </td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = html || `<tr><td colspan="5" class="p-8 text-center text-slate-400 font-bold uppercase">Kho trống</td></tr>`;
        }

        // Excel Export
        window.exportSurplusDashboardExcel = function () {
            if (!window._dashboardData || window._dashboardData.length === 0) {
                alert("Không có dữ liệu để xuất!");
                return;
            }

            const startVal = startDateInput.value;
            const endVal = endDateInput.value;
            const dateStr = startVal === endVal ? startVal : `${startVal}_den_${endVal}`;

            // Sort data like the UI before exporting
            window._dashboardData.sort((a, b) => b.lastUpdated - a.lastUpdated);

            const exportData = window._dashboardData.map((r, index) => {
                const total = r.lps + r.molding + r.leanline;
                return {
                    "STT": index + 1,
                    "RPRO": r.rpro,
                    "BOM": r.bom,
                    "PU DESCRIPTION": r.pu,
                    "FABRIC DESCRIPTION": r.fabric,
                    "LPS": r.lps,
                    "MOLDING": r.molding,
                    "LEANLINE": r.leanline,
                    "TOTAL": total,
                    "Last Updated": r.lastUpdated.toLocaleString('vi-VN')
                };
            }).filter(item => item.TOTAL > 0);

            const ws = XLSX.utils.json_to_sheet(exportData);

            const colWidths = [
                { wch: 5 }, { wch: 20 }, { wch: 15 }, { wch: 35 }, { wch: 35 },
                { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 20 }
            ];
            ws['!cols'] = colWidths;

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "SURPLUS_DASHBOARD");
            XLSX.writeFile(wb, `Surplus_Dashboard_${dateStr}.xlsx`);
        };

        if (document.getElementById('btn-export-excel')) {
            document.getElementById('btn-export-excel').onclick = window.exportSurplusDashboardExcel;
        }

        // Init Dates
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const lastMonth = new Date(today);
            lastMonth.setMonth(today.getMonth() - 1);

            startDateInput.value = lastMonth.toISOString().split('T')[0];
            endDateInput.value = today.toISOString().split('T')[0];

            loadDashboardData();
        });

    </script>
</body>

</html>
